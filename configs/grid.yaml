  # Filler bank (~30 templates). Pure padding: NO "access code", NO "unlocks",
  # NO uppercase alphanumeric codes, NO key/value patterns (§4.1). {TOPIC} is
  # drawn from topic_words; filler for a cell is a deterministic function of the
  # cell (identical across the cell's samples, keeping the skeleton fixed).
  filler_templates:
    - "The committee spent the afternoon discussing the future of the {TOPIC}."
    - "Many travellers pass through the region hoping to glimpse the {TOPIC}."
    - "Historians still argue about the true origin of the {TOPIC}."
    - "Every spring the villagers gather to celebrate the {TOPIC}."
    - "A gentle rain fell over the valley near the {TOPIC}."
    - "The old librarian catalogued every mention of the {TOPIC}."
    - "Students often write essays about the meaning of the {TOPIC}."
    - "In the market square people traded stories about the {TOPIC}."
    - "The engineer sketched a rough plan beside the {TOPIC}."
    - "Long shadows stretched across the field toward the {TOPIC}."
    - "Nobody could quite explain the popularity of the {TOPIC}."
    - "The children invented a song about the wandering {TOPIC}."
    - "Each morning the baker walked past the quiet {TOPIC}."
    - "Scholars from distant cities came to study the {TOPIC}."
    - "The festival lasted three days beneath the great {TOPIC}."
    - "A single lamp lit the corridor leading to the {TOPIC}."
    - "The captain noted the weather before approaching the {TOPIC}."
    - "Rumours spread quickly about the newly repaired {TOPIC}."
    - "Painters found endless inspiration in the {TOPIC}."
    - "The council voted to preserve the historic {TOPIC}."
    - "Farmers measured the harvest against the shadow of the {TOPIC}."
