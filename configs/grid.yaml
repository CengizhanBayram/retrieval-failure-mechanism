# ===========================================================================
# E1 grid + procedural probe resources (task §4.1, §5).
#
# NOTHING here is a decision threshold — those live in the researcher-authored
# preregistration.yaml. This file is the STIMULUS design: the cell grid and the
# templates/vocab the probe generator draws from. All probe text is generated
# from these; no external corpora are ever used (§12).
# ===========================================================================

# ---- E1 cell grid (§5) ----------------------------------------------------
grid:
  context_length: [2048, 4096, 8192, 16384]
  needle_position: [0.1, 0.3, 0.5, 0.7, 0.9]
  distractor_count: [0, 2, 5, 10]
  similarity: ["shell_same", "shell_diff"]
  # The 0-distractor rows are the clean baseline and are capture-free by
  # construction (no distractor spans). similarity is irrelevant when count==0;
  # the grid builder emits a single 0-distractor cell per (ctx, pos) tagged
  # similarity="none".

# Documented OOM fallback (§5, §1.9): the ONE permitted fallback. When a run
# OOMs at 16384, replace it with 12288, log LOUDLY, and flag it in outputs.
oom_fallback:
  from_context_length: 16384
  to_context_length: 12288

# ---- Probe text skeleton (§4.1) -------------------------------------------
probe:
  # A short, constant preamble (same tokens for every probe of every cell) so
  # the model is oriented. Being constant, it does not affect skeleton
  # alignment across a cell's samples.
  preamble: "Read the following text carefully. It contains one access code you must remember.\n\n"

  needle_template: "The access code for the {ADJ} {NOUN} is {VALUE}."

  distractor_templates:
    # identical sentence template, different ADJ+NOUN, different VALUE
    shell_same: "The access code for the {ADJ} {NOUN} is {VALUE}."
    # paraphrased template, different key, different VALUE
    shell_diff: "Remember that {NOUN} {ADJ} unlocks with {VALUE}."

  question_template: "\n\nWhat is the access code for the {ADJ} {NOUN}? Answer with the code only."

  # VALUE = uppercase alphanumeric. Ambiguous glyphs (0/O, 1/I) are excluded so
  # a decoded value is unambiguous for the grader. Rejection-sampling forces a
  # per-cell canonical TOKEN length (§4.1 token-skeleton alignment).
  value:
    alphabet: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
    char_len: 8
    # max rejection-sampling tries to hit the cell's canonical token length
    # before failing loudly (ProbeError).
    max_value_tries: 4000

  # Slot vocab. ADJ and NOUN are disjoint pools (an adjective is never a noun),
  # so a key is always ADJ+NOUN. At startup the generator filters each pool
  # through the model's tokenizer to the subset that tokenises to a fixed
  # (single) token WITH a leading space, giving identical slot token-lengths
  # across a cell's samples. `min_vocab_after_filter` guards that enough
  # survive for the largest cell (needle + all distractors, drawn w/o
  # replacement); otherwise fail loudly.
  min_vocab_after_filter: 20
  adjectives:
    - crimson
    - golden
    - silent
    - ancient
    - hollow
    - frozen
    - amber
    - velvet
    - copper
    - marble
    - hidden
