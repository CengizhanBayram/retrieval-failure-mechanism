# ===========================================================================
# External-repo and artifact locations (config-driven; ground rule §1.1).
#
# This study REUSES the shared `src/` and `rhp/` code and the registry pinned
# model registry + detection artifacts. Nothing here is edited by this study; it is
# imported only (§0, §12). Every path may be overridden by an environment
# variable so the same configs run unchanged on Colab and locally.
#
# Resolution for each path (first hit wins):
#   1. the env var named in `*_env`
#   2. the literal path in `*_path` (if it exists)
#   3. sibling-directory autodiscovery by folder name (see failure_mech.panel)
# ===========================================================================

part1_repo:
  # "Does RoPE Prevent or Degrade Retrieval Heads?" - provides src/ (model_loader,
  # activation_patching, niah_evaluator, stats_utils).
  env: "RHP_PART1_REPO"
  dirname: "Does-RoPE-Prevent-or-Degrade-Retrieval-Heads-A-Mechanistic-Analysis-Across-Model-Families"
  path: "../Does-RoPE-Prevent-or-Degrade-Retrieval-Heads-A-Mechanistic-Analysis-Across-Model-Families"

part2_repo:
  # retrieval-head-profile - provides the rhp package, configs/panel.yaml (pinned
  # SHAs) and the detection artifacts under datas/results/profile/.
  env: "RHP_PART2_REPO"
  dirname: "retrieval-head-profile"
  path: "../rope-dimensions+/retrieval-head-profile"

# The pinned model registry. This study never edits it; it reads the pinned
# commit SHAs and rope_theta from here (§1.3).
panel_yaml:
  env: "RHP_PANEL_YAML"
  # relative to part2_repo when not absolute
  relpath: "configs/panel.yaml"

# Detection artifacts (the ranked retrieval-head lists). One JSON per (model,
# seed): datas/results/profile/{panel_key}_seed{seed}.json (§ artifact reader).
detection_artifacts:
  env: "RHP_DETECTION_DIR"
  relpath: "datas/results/profile"
  seed: 42                      # which detection seed's artifact to consume

# Where this study writes everything (§1.6, §1.8).
output:
  results_dir: "./results"
  checkpoints_dir: "./results/checkpoints"
  donor_store_dir: "./results/donors"

# Map task-spec model keys (§2) -> the registry panel.yaml keys. Each resolves to a
# PINNED commit SHA in panel.yaml, and each already has a detection
# artifact (datas/results/profile/<panel_key>_seed42.json).
#
# The panel was expanded from the original 4 to a balanced 7 instruct models
# spanning 6 families and both attention structures (GQA + MHA):
#   llama31_8b_instruct   llama    GQA 32/8     theta 500k   (L4)
#   qwen25_7b_instruct    qwen     GQA 28/4     theta 1M     (L4)
#   gemma2_9b_it          gemma    GQA 16/8 +softcap  10k    (A100, eager capture)
#   mistral7b_v03_instruct mistral GQA 32/8     theta 1M     (L4)
#   olmo2_7b_instruct     olmo     MHA 32/32 +QK-norm 500k   (L4)
#   phi35_mini            phi      MHA 32/32, fused qkv  10k (L4)
#   qwen25_3b_instruct    qwen     GQA 16/2     theta 1M     (L4)  [size axis]
models:
  llama31_8b_instruct: "llama31_8b_instruct"
  gemma2_9b_it:        "gemma2_9b_it"
  mistral_7b_instruct: "mistral7b_v03_instruct"
  qwen25_7b_instruct:  "qwen25_7b_instruct"
  olmo2_7b_instruct:   "olmo2_7b_instruct"
  phi35_mini:          "phi35_mini"
  qwen25_3b_instruct:  "qwen25_3b_instruct"
